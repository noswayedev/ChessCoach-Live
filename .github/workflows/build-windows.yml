name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Extract bundled Stockfish
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath 'stockfish/stockfish-engine.zip' -DestinationPath 'stockfish' -Force
          if (-not (Test-Path 'stockfish/stockfish.exe')) { throw 'Stockfish was not extracted' }
      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6,<7"
      - name: Check Python syntax
        run: python -m py_compile chess_coach_live.py
      - name: Build standalone EXE (no console)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ChessCoachLive --icon "assets/ChessCoachLive.ico" --add-data "assets/ChessCoachLive.ico;assets" --add-binary "stockfish/stockfish.exe;stockfish" chess_coach_live.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ChessCoachLive-Windows-x64
          path: dist/ChessCoachLive.exe
          if-no-files-found: error
          retention-days: 30
